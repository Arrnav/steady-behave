name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build and run self-test
        run: ./build.sh --selftest

      - name: Check for network code
        run: |
          if grep -rnE "URLSession|NWConnection|import Network|https?://" Sources; then
            echo "Network code found in Sources"; exit 1
          fi
          if nm build/Steady.app/Contents/MacOS/Steady | grep -iE "URLSession|NWConnection"; then
            echo "Networking symbols found in the binary"; exit 1
          fi

      - name: Install linters
        run: brew install swiftlint shellcheck

      - name: SwiftLint
        run: swiftlint lint --strict

      - name: ShellCheck
        run: shellcheck build.sh
